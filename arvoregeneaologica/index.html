<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#1B3A2D"/>
  <title>Árvore Genealógica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --forest: #1B3A2D;
      --forest-mid: #2D5A44;
      --sage: #7CB899;
      --cream: #F5EDD7;
      --card: #fff;
      --muted: rgba(245,237,215,.65);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(160deg, #142e23 0%, var(--forest) 50%, #234a38 100%);
      color: var(--cream);
    }

    .app-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(20,46,35,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .app-header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.1rem; font-weight: 700; line-height: 1.2;
    }
    .app-header .sub { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 8px 14px; border-radius: 10px;
      font-size: .82rem; font-weight: 600; text-decoration: none; border: none; cursor: pointer;
      font-family: inherit; transition: background .2s;
    }
    .btn-cream { background: var(--cream); color: var(--forest); }
    .btn-cream:hover { background: #fff; }
    .btn-ghost {
      background: rgba(255,255,255,.08); color: var(--cream);
      border: 1px solid rgba(255,255,255,.15);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.14); }
    .btn-icon { width: 40px; padding: 0; font-size: 1.2rem; }

    .search-wrap {
      position: fixed; top: 72px; left: 16px; right: 16px; z-index: 90;
      max-width: 320px;
    }
    .search-wrap input {
      width: 100%; min-height: 44px; padding: 10px 14px 10px 40px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
      background: rgba(0,0,0,.25); color: #fff; font: inherit; font-size: .9rem;
    }
    .search-wrap input::placeholder { color: rgba(255,255,255,.4); }
    .search-wrap input:focus { outline: none; border-color: var(--sage); }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      opacity: .5; pointer-events: none;
    }

    .zoom-controls {
      position: fixed; bottom: 24px; right: 16px; z-index: 90;
      display: flex; flex-direction: column; gap: 8px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #viewport {
      position: fixed; inset: 0; z-index: 10;
      padding-top: 64px;
      cursor: grab; touch-action: none; overflow: hidden;
    }
    #viewport.dragging { cursor: grabbing; }

    #canvas {
      position: absolute; left: 0; top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #lines {
      position: absolute; left: 0; top: 0;
      overflow: visible; pointer-events: none;
    }

    .nodes-layer { position: relative; }

    .node {
      position: absolute;
      width: 200px;
      min-height: 130px;
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.28);
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s, transform .15s;
      color: var(--forest);
    }
    .node:hover { box-shadow: 0 12px 40px rgba(0,0,0,.35); transform: translateY(-2px); }
    .node.highlight { border-color: var(--sage); box-shadow: 0 0 0 4px rgba(124,184,153,.35); }
    .node-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, var(--forest), var(--forest-mid));
      color: var(--cream); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .9rem; margin-bottom: 10px;
      overflow: hidden; flex-shrink: 0;
    }
    .node-avatar img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .node-name { font-weight: 700; font-size: .86rem; line-height: 1.35; margin-bottom: 4px; word-break: break-word; }
    .node-dates { font-size: .75rem; color: #64748b; }
    .node-age {
      display: inline-block; margin-top: 6px; padding: 3px 8px;
      border-radius: 999px; background: rgba(27,58,45,.08);
      font-size: .7rem; font-weight: 600; color: var(--forest-mid);
    }

    .state-empty, .state-loading, .state-error {
      position: fixed; inset: 0; z-index: 80;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      background: linear-gradient(160deg, #142e23 0%, var(--forest) 50%, #234a38 100%);
    }
    .state-box { max-width: 400px; }
    .state-box h2 {
      font-family: 'Fraunces', serif; font-size: 1.6rem; margin-bottom: 10px;
    }
    .state-box p { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 16px; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: 100%; max-width: 420px;
      background: #fff; color: var(--forest);
      border-radius: 20px 20px 16px 16px;
      padding: 24px; transform: translateY(20px); transition: transform .25s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-close {
      float: right; background: none; border: none; font-size: 1.4rem;
      cursor: pointer; color: #94a3b8; line-height: 1;
    }
    .modal h2 { font-family: 'Fraunces', serif; font-size: 1.35rem; margin-bottom: 8px; padding-right: 32px; }
    .modal-photo {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      margin-bottom: 14px; border: 3px solid rgba(27,58,45,.15);
    }
    .modal-photo-placeholder {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, var(--forest), var(--forest-mid));
      color: var(--cream); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.4rem; margin-bottom: 14px;
    }
    .modal-meta { font-size: .88rem; color: #64748b; margin-bottom: 12px; }
    .modal-notes { font-size: .88rem; line-height: 1.55; color: #334155; }

    @media (min-width: 768px) {
      .app-header h1 { font-size: 1.25rem; }
      .search-wrap { top: 80px; left: 24px; }
      .modal-overlay { align-items: center; }
      .modal { border-radius: 20px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div>
      <h1>Árvore Genealógica</h1>
      <p class="sub" id="count-label">Carregando...</p>
    </div>
    <div class="header-actions">
      <a href="/painel/" class="btn btn-ghost btn-sm">Painel</a>
    </div>
  </header>

  <div class="search-wrap" id="search-wrap" hidden>
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="Buscar familiar..." autocomplete="off"/>
  </div>

  <div id="loading" class="state-loading">
    <div class="state-box"><h2>Carregando árvore...</h2></div>
  </div>

  <div id="empty" class="state-empty" hidden>
    <div class="state-box">
      <h2>Nenhuma pessoa ainda</h2>
      <p>Cadastre familiares no painel para visualizar a árvore aqui.</p>
      <a href="/painel/pessoa.php" class="btn btn-cream">Cadastrar pessoa</a>
    </div>
  </div>

  <div id="error" class="state-error" hidden>
    <div class="state-box">
      <h2>Não foi possível carregar</h2>
      <p id="error-msg">Verifique se o SQL foi executado e tente novamente.</p>
      <button type="button" class="btn btn-cream" onclick="location.reload()">Tentar novamente</button>
    </div>
  </div>

  <div id="viewport" hidden>
    <div id="canvas">
      <svg id="lines" width="1" height="1"></svg>
      <div class="nodes-layer" id="nodes"></div>
    </div>
  </div>

  <div class="zoom-controls" id="zoom-controls" hidden>
    <button type="button" class="btn btn-ghost btn-icon" id="zoom-in" aria-label="Aumentar zoom">+</button>
    <button type="button" class="btn btn-ghost btn-icon" id="zoom-out" aria-label="Diminuir zoom">−</button>
    <button type="button" class="btn btn-ghost btn-icon" id="zoom-reset" aria-label="Centralizar" title="Centralizar">◎</button>
  </div>

  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <button type="button" class="modal-close" id="modal-close" aria-label="Fechar">&times;</button>
      <div id="modal-photo-wrap"></div>
      <h2 id="modal-name"></h2>
      <p class="modal-meta" id="modal-meta"></p>
      <p class="modal-notes" id="modal-notes"></p>
    </div>
  </div>

  <script>
  (function () {
    const NODE_W = 200, NODE_H = 140, GAP_X = 72, GAP_Y = 120, SPOUSE_GAP = 32;

    let data = null, positions = {}, scale = 1, panX = 0, panY = 0;
    let peopleMap = {};

    const $ = (id) => document.getElementById(id);
    const viewport = $('viewport');
    const canvas = $('canvas');
    const nodesEl = $('nodes');
    const linesEl = $('lines');

    function showState(name) {
      ['loading', 'empty', 'error'].forEach(function (id) {
        $(id).hidden = id !== name;
      });
      viewport.hidden = name !== null;
      $('search-wrap').hidden = name !== null;
      $('zoom-controls').hidden = name !== null;
    }

    function hideStates() {
      showState(null);
    }

    function buildChildrenMap(parentLinks) {
      const children = {};
      const primaryParent = {};
      parentLinks.forEach(function (l) {
        if (primaryParent[l.child] === undefined) primaryParent[l.child] = l.parent;
      });
      parentLinks.forEach(function (l) {
        if (primaryParent[l.child] !== l.parent) return;
        if (!children[l.parent]) children[l.parent] = [];
        if (children[l.parent].indexOf(l.child) === -1) children[l.parent].push(l.child);
      });
      Object.keys(children).forEach(function (pid) {
        children[pid].sort(function (a, b) {
          return (peopleMap[a] ? peopleMap[a].full_name : '').localeCompare(peopleMap[b] ? peopleMap[b].full_name : '');
        });
      });
      return children;
    }

    function findRoots(people, parentLinks) {
      const hasParent = {};
      parentLinks.forEach(function (l) { hasParent[l.child] = true; });
      const roots = people.filter(function (p) { return !hasParent[p.id]; }).map(function (p) { return p.id; });
      return roots.length ? roots : people.map(function (p) { return p.id; });
    }

    /** Largura total do subárvore (inclui filhos e espaçamento). */
    function subtreeWidth(id, childrenMap, memo) {
      if (memo[id] !== undefined) return memo[id];
      const kids = childrenMap[id] || [];
      if (!kids.length) {
        memo[id] = NODE_W;
        return NODE_W;
      }
      var total = 0;
      kids.forEach(function (cid, i) {
        total += subtreeWidth(cid, childrenMap, memo);
        if (i < kids.length - 1) total += GAP_X;
      });
      memo[id] = Math.max(NODE_W, total);
      return memo[id];
    }

    /** Posiciona subárvore; retorna próximo X livre à direita. */
    function layoutSubtree(id, depth, leftX, childrenMap, widthMemo, positions) {
      const kids = childrenMap[id] || [];
      const myWidth = subtreeWidth(id, childrenMap, widthMemo);
      const y = depth * (NODE_H + GAP_Y);

      if (!kids.length) {
        positions[id] = { x: leftX + (myWidth - NODE_W) / 2, y: y };
        return leftX + myWidth;
      }

      var cursor = leftX;
      var childCenters = [];
      kids.forEach(function (cid, i) {
        var cw = subtreeWidth(cid, childrenMap, widthMemo);
        layoutSubtree(cid, depth + 1, cursor, childrenMap, widthMemo, positions);
        childCenters.push(cursor + cw / 2);
        cursor += cw + (i < kids.length - 1 ? GAP_X : 0);
      });

      var parentCenter = (childCenters[0] + childCenters[childCenters.length - 1]) / 2;
      positions[id] = { x: parentCenter - NODE_W / 2, y: y };
      return leftX + myWidth;
    }

    function placeSpouses(positions, spouseLinks) {
      spouseLinks.forEach(function (s) {
        var a = positions[s.a], b = positions[s.b];
        if (!a || !b) return;
        if (Math.abs(a.y - b.y) > 8) return;
        if (a.x <= b.x) {
          b.x = Math.max(b.x, a.x + NODE_W + SPOUSE_GAP);
        } else {
          a.x = Math.max(a.x, b.x + NODE_W + SPOUSE_GAP);
        }
      });
    }

    /** Empurra cards na mesma linha que se sobrepõem. */
    function resolveRowCollisions(positions) {
      var rows = {};
      Object.keys(positions).forEach(function (id) {
        var y = Math.round(positions[id].y);
        if (!rows[y]) rows[y] = [];
        rows[y].push(+id);
      });
      Object.keys(rows).forEach(function (y) {
        var ids = rows[y].sort(function (a, b) { return positions[a].x - positions[b].x; });
        for (var i = 1; i < ids.length; i++) {
          var prev = ids[i - 1], curr = ids[i];
          var minX = positions[prev].x + NODE_W + GAP_X;
          if (positions[curr].x < minX) {
            var shift = minX - positions[curr].x;
            for (var j = i; j < ids.length; j++) {
              positions[ids[j]].x += shift;
            }
          }
        }
      });
    }

    function layoutForest(people, parentLinks, spouseLinks) {
      peopleMap = {};
      people.forEach(function (p) { peopleMap[p.id] = p; });

      const childrenMap = buildChildrenMap(parentLinks);
      const roots = findRoots(people, parentLinks);
      const widthMemo = {};
      const positions = {};
      var offsetX = 0;

      roots.forEach(function (rid) {
        var w = subtreeWidth(rid, childrenMap, widthMemo);
        layoutSubtree(rid, 0, offsetX, childrenMap, widthMemo, positions);
        offsetX += w + GAP_X * 4;
      });

      people.forEach(function (p) {
        if (!positions[p.id]) {
          positions[p.id] = { x: offsetX, y: 0 };
          offsetX += NODE_W + GAP_X * 2;
        }
      });

      placeSpouses(positions, spouseLinks);
      resolveRowCollisions(positions);
      return positions;
    }

    function renderTree() {
      positions = layoutForest(data.people, data.parent_links, data.spouse_links);

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      Object.values(positions).forEach(pos => {
        minX = Math.min(minX, pos.x);
        minY = Math.min(minY, pos.y);
        maxX = Math.max(maxX, pos.x + NODE_W);
        maxY = Math.max(maxY, pos.y + NODE_H);
      });

      const pad = 80;
      const cw = maxX - minX + pad * 2;
      const ch = maxY - minY + pad * 2;

      Object.keys(positions).forEach(id => {
        positions[id].x = positions[id].x - minX + pad;
        positions[id].y = positions[id].y - minY + pad;
      });

      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      linesEl.setAttribute('width', cw);
      linesEl.setAttribute('height', ch);

      nodesEl.innerHTML = '';
      linesEl.innerHTML = '';

      data.parent_links.forEach(l => {
        const p = positions[l.parent], c = positions[l.child];
        if (!p || !c) return;
        const x1 = p.x + NODE_W / 2, y1 = p.y + NODE_H;
        const x2 = c.x + NODE_W / 2, y2 = c.y;
        const midY = (y1 + y2) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M${x1},${y1} V${midY} H${x2} V${y2}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'rgba(245,237,215,.35)');
        path.setAttribute('stroke-width', '2');
        linesEl.appendChild(path);
      });

      data.spouse_links.forEach(s => {
        const a = positions[s.a], b = positions[s.b];
        if (!a || !b || Math.abs(a.y - b.y) > 10) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', a.x + NODE_W);
        line.setAttribute('y1', a.y + NODE_H / 2);
        line.setAttribute('x2', b.x);
        line.setAttribute('y2', b.y + NODE_H / 2);
        line.setAttribute('stroke', 'rgba(124,184,153,.6)');
        line.setAttribute('stroke-width', '2');
        line.setAttribute('stroke-dasharray', '6 4');
        linesEl.appendChild(line);
      });

      data.people.forEach(person => {
        const pos = positions[person.id];
        if (!pos) return;
        const el = document.createElement('div');
        el.className = 'node';
        el.style.left = pos.x + 'px';
        el.style.top = pos.y + 'px';
        el.dataset.id = person.id;
        el.innerHTML =
          '<div class="node-avatar">' +
            (person.photo
              ? '<img src="' + esc(person.photo) + '" alt="" loading="lazy"/>'
              : esc(person.initials)) +
          '</div>' +
          '<div class="node-name">' + esc(person.full_name) + '</div>' +
          (person.dates ? '<div class="node-dates">' + esc(person.dates) + '</div>' : '') +
          (person.age ? '<span class="node-age">' + esc(person.age) + '</span>' : '');
        el.addEventListener('click', () => openModal(person));
        nodesEl.appendChild(el);
      });

      $('count-label').textContent = data.count + (data.count === 1 ? ' pessoa' : ' pessoas');
      centerView(cw, ch);
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function applyTransform() {
      canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    }

    function centerView(cw, ch) {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const s = Math.min(1, (vw - 40) / cw, (vh - 40) / ch);
      scale = Math.max(0.3, s);
      panX = (vw - cw * scale) / 2;
      panY = (vh - cw * 0) / 2 - (ch * scale) / 2 + 20;
      if (data.count === 1) {
        panX = (vw - NODE_W * scale) / 2;
        panY = (vh - NODE_H * scale) / 2;
      }
      applyTransform();
    }

    function openModal(person) {
      var wrap = $('modal-photo-wrap');
      wrap.innerHTML = person.photo
        ? '<img src="' + esc(person.photo) + '" alt="" class="modal-photo"/>'
        : '<div class="modal-photo-placeholder">' + esc(person.initials) + '</div>';
      $('modal-name').textContent = person.full_name;
      const meta = [person.dates, person.age].filter(Boolean).join(' · ');
      $('modal-meta').textContent = meta;
      $('modal-notes').textContent = person.notes || '';
      $('modal-notes').hidden = !person.notes;
      $('modal').classList.add('open');
      $('modal').setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      $('modal').classList.remove('open');
      $('modal').setAttribute('aria-hidden', 'true');
    }

    // Pan & zoom
    let dragging = false, lastX = 0, lastY = 0;
    viewport.addEventListener('pointerdown', e => {
      if (e.target.closest('.node')) return;
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
      viewport.classList.add('dragging');
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener('pointermove', e => {
      if (!dragging) return;
      panX += e.clientX - lastX;
      panY += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      applyTransform();
    });
    viewport.addEventListener('pointerup', () => {
      dragging = false;
      viewport.classList.remove('dragging');
    });

    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.92 : 1.08;
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      panX = mx - (mx - panX) * delta;
      panY = my - (my - panY) * delta;
      scale = Math.min(2.5, Math.max(0.2, scale * delta));
      applyTransform();
    }, { passive: false });

    let pinchDist = 0;
    viewport.addEventListener('touchstart', e => {
      if (e.touches.length === 2) pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }, { passive: true });
    viewport.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (pinchDist) {
          const delta = dist / pinchDist;
          scale = Math.min(2.5, Math.max(0.2, scale * delta));
          applyTransform();
        }
        pinchDist = dist;
      }
    }, { passive: false });

    $('zoom-in').addEventListener('click', () => { scale = Math.min(2.5, scale * 1.2); applyTransform(); });
    $('zoom-out').addEventListener('click', () => { scale = Math.max(0.2, scale / 1.2); applyTransform(); });
    $('zoom-reset').addEventListener('click', () => {
      const cw = parseFloat(canvas.style.width) || 400;
      const ch = parseFloat(canvas.style.height) || 300;
      centerView(cw, ch);
    });

    $('modal-close').addEventListener('click', closeModal);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

    $('search').addEventListener('input', function () {
      const q = this.value.toLowerCase().trim();
      document.querySelectorAll('.node').forEach(n => {
        const p = peopleMap[+n.dataset.id];
        const match = !q || (p && p.full_name.toLowerCase().includes(q));
        n.classList.toggle('highlight', !!q && match);
        n.style.opacity = !q || match ? '1' : '0.25';
      });
    });

    fetch('/api/tree.php')
      .then(function (r) {
        if (!r.ok) throw new Error('Erro ao carregar dados (' + r.status + ').');
        return r.json();
      })
      .then(function (json) {
        if (json.error) throw new Error(json.error);
        data = json;
        if (!data.count) {
          showState('empty');
          $('count-label').textContent = '0 pessoas';
          return;
        }
        hideStates();
        viewport.hidden = false;
        $('search-wrap').hidden = false;
        $('zoom-controls').hidden = false;
        renderTree();
      })
      .catch(function (err) {
        showState('error');
        $('error-msg').textContent = err.message || 'Erro ao carregar dados.';
      });

    window.addEventListener('resize', () => {
      if (data && data.count) {
        const cw = parseFloat(canvas.style.width) || 400;
        const ch = parseFloat(canvas.style.height) || 300;
        centerView(cw, ch);
      }
    });
  })();
  </script>
  <script src="https://linkbio.api.br/tracker.js" data-slug="arvoregeneaologica" defer></script>
</body>
</html>
